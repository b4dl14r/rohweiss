name: GitHub Pages

on:
  push:
    branches: [claude/elegant-heisenberg-tn1wf3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Seite vorbereiten
        run: |
          mkdir _site
          rsync -a --exclude '.git*' --exclude 'api' --exclude '.htaccess' ./ _site/
          touch _site/.nojekyll
          python3 .github/scripts/pages_base.py _site "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
